<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas Deadlock Hunter</title>
  <style>
    :root { --bg:#f4f6fa; --fg:#1c2733; --ok:#1f8a4c; --bad:#c62828; --card:#fff; --border:#d6dee8; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1722; --fg:#e4ebf3; --ok:#4ccb82; --bad:#ff6b6b; --card:#17212e; --border:#2c3a4c; } }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 24px 16px; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 4px; }
    .summary { font-size: 18px; font-weight: 700; margin: 12px 0; }
    .summary.ok { color: var(--ok); } .summary.bad { color: var(--bad); }
    ul { list-style: none; padding: 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
    li { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    li:last-child { border-bottom: 0; }
    .pass::before { content: "✔ "; color: var(--ok); font-weight: 700; }
    .fail::before { content: "✘ "; color: var(--bad); font-weight: 700; }
    .err { color: var(--bad); font-family: Consolas, monospace; font-size: 12px; display: block; margin-top: 2px; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Pruebas automatizadas · Deadlock Hunter</h1>
    <p>Ejecuta los casos de prueba del motor (<code>js/engine.js</code>) y verifica que cada escenario termine en el estado esperado. <a href="../index.html">← Volver a la aplicación</a></p>
    <div id="summary" class="summary"></div>
    <ul id="results"></ul>
    <p id="when" style="opacity:.7;font-size:12px"></p>
  </main>
  <script src="../js/i18n.js"></script>
  <script src="../js/engine.js"></script>
  <script src="../js/scenarios.js"></script>
  <script src="cases.js"></script>
  <script>
    const results = DeadlockTests.run(DeadlockEngine, DeadlockScenarios);
    const passed = results.filter(r => r.pass).length;
    const sum = document.getElementById('summary');
    sum.textContent = `${passed}/${results.length} pruebas superadas`;
    sum.className = 'summary ' + (passed === results.length ? 'ok' : 'bad');
    document.getElementById('results').innerHTML = results.map(r =>
      `<li class="${r.pass ? 'pass' : 'fail'}">${r.name}${r.pass ? '' : `<span class="err">${r.error}</span>`}</li>`).join('');
    document.getElementById('when').textContent = 'Ejecutado: ' + new Date().toLocaleString('es');
  </script>
</body>
</html>
